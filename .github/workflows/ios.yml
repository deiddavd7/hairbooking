name: iOS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test HairBooking
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Test
        run: |
          xcodebuild \
            -project HairBooking.xcodeproj \
            -scheme HairBooking \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            clean test
